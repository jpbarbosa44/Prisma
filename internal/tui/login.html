<!doctype html>
<!-- Tela do PIN: aparece no lugar da interface quando há PIN definido e a
     sessão não existe (ou ficou parada demais). Servida por web_seguranca.go. -->
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Prisma">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone-192.png">
  <link rel="apple-touch-icon" href="icone-180.png">
  <title>Prisma — PIN</title>
  <script>
    // mesmo tema da interface (auto / claro / escuro), antes de pintar
    try {
      const t = localStorage.getItem("prisma.tema");
      const claro = t === "claro" || (t !== "escuro" && matchMedia("(prefers-color-scheme: light)").matches);
      if (claro) document.documentElement.dataset.tema = "claro";
    } catch (e) { }
  </script>
  <style>
    :root {
      --bg: #0e1014;
      --painel: #12151b;
      --borda: #232a35;
      --fg: #d8dee4;
      --dim: #6c7380;
      --cy: #4dd8e6;
      --err: #ee6a6a;
      --tecla: #171b23;
    }

    :root[data-tema="claro"] {
      --bg: #f5f7fa;
      --painel: #ffffff;
      --borda: #d5dbe3;
      --fg: #1d232b;
      --dim: #5f6875;
      --cy: #00798c;
      --err: #c0392b;
      --tecla: #eef2f6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    form {
      width: min(320px, 100%);
      text-align: center;
    }

    img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: .3em;
      color: var(--cy);
      margin: 10px 0 2px;
    }

    p {
      margin: 0 0 18px;
      color: var(--dim);
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 24px;
      letter-spacing: .4em;
      text-align: center;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--borda);
      background: var(--painel);
      color: var(--fg);
      outline: none;
    }

    input:focus {
      border-color: var(--cy);
    }

    .teclado {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0 12px;
    }

    .teclado button,
    .entrar {
      font: inherit;
      font-size: 20px;
      min-height: 54px;
      border-radius: 12px;
      border: 1px solid var(--borda);
      background: var(--tecla);
      color: var(--fg);
      cursor: pointer;
      touch-action: manipulation;
    }

    .teclado button:active {
      border-color: var(--cy);
    }

    .entrar {
      width: 100%;
      background: var(--cy);
      border-color: var(--cy);
      color: var(--bg);
      font-weight: 600;
      font-size: 16px;
    }

    .erro {
      min-height: 1.5em;
      color: var(--err);
      margin: 8px 0 0;
    }
  </style>
</head>

<body>
  <form id="f" autocomplete="off">
    <img src="icone-192.png" alt="">
    <h1>PRISMA</h1>
    <p>Digite o PIN para abrir</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN" autofocus>
    <div class="teclado" aria-hidden="true">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" data-k="apaga">⌫</button><button type="button">0</button><button type="button" data-k="abc" title="letras">abc</button>
    </div>
    <button class="entrar" type="submit">Entrar</button>
    <div class="erro" id="erro" role="alert"></div>
  </form>
  <script>
    const pin = document.getElementById("pin"), erro = document.getElementById("erro");
    document.querySelector(".teclado").addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.k === "apaga") pin.value = pin.value.slice(0, -1);
      else if (b.dataset.k === "abc") { pin.inputMode = pin.inputMode === "text" ? "numeric" : "text"; pin.focus(); }
      else pin.value += b.textContent;
    });
    document.getElementById("f").addEventListener("submit", async e => {
      e.preventDefault();
      erro.textContent = "";
      try {
        const r = await fetch("api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pin.value }),
        });
        if (r.ok) {
          // volta para onde ia — só caminhos daqui: "/..." mas nunca "//outro-site"
          // nem "/\outro-site" (que alguns navegadores leem como "//")
          const volta = new URLSearchParams(location.search).get("volta") || "/";
          location.replace(/^\/(?![\/\\])/.test(volta) ? volta : "/");
          return;
        }
        const j = await r.json().catch(() => ({}));
        erro.textContent = j.erro || "não deu para entrar";
      } catch (x) {
        erro.textContent = "sem conexão com o Prisma";
      }
      pin.value = "";
      pin.focus();
    });
  </script>
</body>

</html>
